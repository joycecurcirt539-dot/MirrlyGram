// Top-level build file where you can add configuration options common to all sub-projects/modules.
ext {
    def singleAbiProp = project.findProperty('singleAbi')?.toString()?.trim()
    if (!singleAbiProp) {
        singleAbiProp = System.getenv('MIRRLY_SINGLE_ABI')?.trim()
    }
    def nativeDebugSymbolsProp = project.findProperty('withNativeDebugSymbols')?.toString()?.trim()
    mirrlySingleAbi = singleAbiProp ?: null
    mirrlyNativeDebugSymbolLevel = (nativeDebugSymbolsProp?.equalsIgnoreCase('true')) ? 'FULL' : 'NONE'
    mirrlyAfatAbis = mirrlySingleAbi ? [mirrlySingleAbi] : ['armeabi-v7a', 'arm64-v8a']
}

buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
    }
}
repositories {
    google()
}

// Strip JLatexMath fonts we don't ship (transitive AAR assets from
// io.noties.markwon:ext-latex -> ru.noties:jlatexmath-android, ~764 KB total under
// assets/org/scilab/forge/jlatexmath/fonts/). Has to live in the APK modules — a
// library's androidResources.ignoreAssetsPattern doesn't filter packaging in apps
// that consume it. Using subprojects keeps it in one place.
//   keep:  base/, latin/, maths/, euler/  (\mathbb, \mathcal, \mathfrak still work)
//   drop:  latin/optional/, maths/optional/  (~290 KB; \textbf/\textit/\mathds fall back)
//          licences/                          (~20 KB; pure license text files)
subprojects {
    plugins.withId('com.android.application') {
        def localPropsFile = rootProject.file('local.properties')
        def googleMapsKey = 'AIzaSyA-t0jLPjUt2FxrA8VPK2EiYHcYcboIR6k'
        if (localPropsFile.exists()) {
            def props = new Properties()
            props.load(new FileInputStream(localPropsFile))
            def customKey = props.getProperty('GOOGLE_MAPS_API_KEY')?.trim()
            if (customKey) {
                googleMapsKey = customKey
            }
        }
        android {
            defaultConfig {
                manifestPlaceholders = [googleMapsApiKey: googleMapsKey]
            }
            androidResources {
                ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~:!optional:!licences:!*stmary*:!*eufb*'
            }
        }
        if (!project.hasProperty('skipAutoClean') && System.getProperty('os.name').toLowerCase().contains('windows')) {
            tasks.matching { it.name.startsWith('assemble') || it.name.startsWith('bundle') }.configureEach {
                finalizedBy(rootProject.tasks.named('cleanMirrlyJunk'))
            }
        }
        if (project.name != 'TMessagesProj_AppTests') {
            def releaseDir = rootProject.layout.projectDirectory.dir("release")
            android.applicationVariants.all { variant ->
                if (variant.assembleProvider != null) {
                    def archTag = rootProject.ext.mirrlySingleAbi ?: (variant.flavorName == "afat" || !variant.flavorName ? "universal" : variant.flavorName)
                    def moduleTag = ""
                    if (project.name == "TMessagesProj_AppStandalone" && variant.buildType.name != "standalone") {
                        moduleTag = "-standalone"
                    } else if (project.name == "TMessagesProj_AppHuawei") {
                        moduleTag = "-huawei"
                    } else if (project.name == "TMessagesProj_AppHockeyApp") {
                        moduleTag = "-ha"
                    }
                    def destFileName = "MirrlyGram-${APP_VERSION_NAME}${moduleTag}-${archTag}-${variant.buildType.name}.apk"
                    def copyTask = tasks.register("copy${variant.name.capitalize()}ApkToRelease", Copy) {
                        from(variant.packageApplicationProvider.map { it.outputDirectory }) {
                            include "*.apk"
                        }
                        into(releaseDir)
                        rename { destFileName }
                    }
                    variant.assembleProvider.configure {
                        finalizedBy(copyTask)
                    }
                }
            }
        }
    }

    if (project.projectDir.absolutePath.contains('/TMessagesProj_Modules/media/')) {
        project.plugins.withId('com.android.library') {
            project.android {
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")

                    if (manifestFile.exists()) {
                        def manifest = new XmlSlurper().parse(manifestFile)
                        def manifestPackage = manifest.@package.text()

                        if (manifestPackage) {
                            namespace manifestPackage
                        }
                    }
                }
            }
        }
    }
}

tasks.register('cleanMirrlyJunk', Exec) {
    group = 'cleanup'
    description = 'Prunes stale Cargo debug artifacts and duplicate native Gradle intermediates inside MirrlyGram V2.'
    workingDir = project.layout.projectDirectory.asFile
    onlyIf { System.getProperty('os.name').toLowerCase().contains('windows') }
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "${project.layout.projectDirectory.asFile}/Tools/clean_mirrlygram.ps1", '-Auto', '-AfterBuild'
}